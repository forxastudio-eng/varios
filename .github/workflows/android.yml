name: Compilar APK de Piano Cascada

on:
  push:
    branches: ["claude/**"]
    paths:
      - "app-piano-tablet/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app-piano-tablet/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar el SDK de Android
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1"

      - name: Pruebas de la lógica pura (core)
        run: PIANO_CORE_ONLY=1 ./gradlew :core:test --no-daemon

      - name: Compilar el APK
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PianoCascada-apk
          path: app-piano-tablet/android/app/build/outputs/apk/release/*.apk

      - name: Publicar el APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk PianoCascada.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest PianoCascada.apk \
            --title "Piano Cascada · compilación ${{ github.run_number }}" \
            --notes "APK para la Galaxy Tab S8 Ultra (arm64). Commit ${{ github.sha }}." \
            --prerelease --target "${{ github.sha }}"
