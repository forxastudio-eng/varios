name: Probar el lector de partituras en un emulador de Android

on:
  push:
    branches: ["claude/**"]
    paths:
      - "app-piano-tablet/android/**"
      - ".github/workflows/android-emulador.yml"
  workflow_dispatch:

concurrency:
  group: emulador-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulador:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app-piano-tablet/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar el SDK de Android
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1"

      - name: Descargar los modelos del lector de partituras
        run: ../tools/descargar_modelos_omr.sh

      - name: Activar la aceleración KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pruebas en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 8G
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: app-piano-tablet/android
          script: ./gradlew :app:connectedDebugAndroidTest -PemulatorAbi=x86_64 --no-daemon --console=plain

      - name: Bibliotecas nativas del APK de pruebas
        if: always()
        run: unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "lib/" || true

      - name: Guardar los informes de la prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-emulador
          path: app-piano-tablet/android/app/build/reports/androidTests/
          if-no-files-found: ignore
