name: Sondeo de paquetes para Android (temporal)

on:
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/probe-chaquopy.yml"
  workflow_dispatch:

jobs:
  sondeo:
    runs-on: ubuntu-24.04
    steps:
      - name: Paquetes de Chaquopy disponibles
        run: |
          for p in numpy onnxruntime opencv-python-headless opencv-python pillow scipy; do
            echo "=== $p"
            curl -s "https://chaquo.com/pypi-13.1/$p/" | grep -oE 'href="[^"]+\.whl[^"]*"' | sed 's/href="//;s/"$//' | sed -E 's#.*/##' | grep -E "cp31[0-3]" | grep arm64 | tail -6
          done
